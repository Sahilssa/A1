name: Daily Trend Report

on:
  schedule:
    # Runs 09:00 IST (03:30 UTC) every day. Edit the cron to change the time.
    - cron: "30 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Commit dashboard + data back to repo
        run: |
          git config user.name "trend-tracker-bot"
          git config user.email "actions@github.com"
          mkdir -p output data
          git add output/ data/
          git diff --quiet --cached || git commit -m "Daily trend report $(date -u +%Y-%m-%d)"
          git push
